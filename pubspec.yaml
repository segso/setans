name: setans
description: "Student assistance tracking application."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2
  csv: ^8.0.0
  showcaseview: ^5.0.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.17
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.25.2
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
